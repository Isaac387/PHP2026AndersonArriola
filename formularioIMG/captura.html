<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Jugador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #9598b0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 400px;
        }
        h2 {
            text-align: center;
            font-family: monospace;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        fieldset {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 15px;
        }
        legend {
            font-weight: bold;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-enviar { background-color: #007bff; flex: 1; }
        .btn-borrar { background-color: #007bff; flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulario de Jugador</h2>
    
    <form action="index.php" method="POST" enctype="multipart/form-data" onsubmit="return validarFormulario();">
        
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label>Alias:</label>
            <input type="text" id="alias" name="alias" required>
        </div>

        <div class="form-group">
            <label>Edad:</label>
            <input type="number" id="edad" name="edad" min="0" required>
        </div>

        <fieldset>
            <legend>Armas a elegir (puedes elegir varias):</legend>
            <label><input type="checkbox" name="armas[]" value="Maza"> Maza</label>
            <label><input type="checkbox" name="armas[]" value="Antorcha"> Antorcha</label>
            <label><input type="checkbox" name="armas[]" value="Martillo"> Martillo</label>
            <label><input type="checkbox" name="armas[]" value="Látigo"> Látigo</label>
        </fieldset>

        <fieldset>
            <legend>¿Practica artes mágicas?</legend>
            <label><input type="radio" name="magia" value="Sí" required> Sí</label>
            <label><input type="radio" name="magia" value="No"> No</label>
        </fieldset>

        <div class="form-group">
            <label>Subir imagen:</label>
            <input type="file" id="imagen" name="imagen" accept=".png">
        </div>

        <div class="btn-container">
            <button type="submit" class="btn-enviar">Enviar</button>
            <button type="reset" class="btn-borrar">Borrar</button>
        </div>
    </form>
</div>

<script>
    function validarFormulario() {
        const inputImagen = document.getElementById('imagen');
        if (inputImagen.files.length > 0) {
            const archivo = inputImagen.files[0];
            // Validar tamaño máximo de 10 KB (10 * 1024 bytes)
            if (archivo.size > 5242880) {
                alert("El archivo es demasiado grande. El tamaño máximo permitido es 10 KB.");
                return false;
            }
            // Validar extensión PNG
            if (!archivo.name.toLowerCase().endsWith('.png')) {
                alert("Solo se permiten archivos de tipo PNG.");
                return false;
            }
        }
        return true;
    }
</script>

</body>
</html>
